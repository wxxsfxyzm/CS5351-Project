# CS5351 AI-use log. Mandatory; keep up to date.
#
# Add one entry per agent-assisted change. A pull request that
# changes code or prompts without a new or updated entry is blocked
# by the AI-use log gate.
#
# One shared file for the whole team. Rules:
#   - Append new entries at the end; never edit or delete another
#     member's entries.
#   - IDs are AI-<github-handle>-NNNN. Each member numbers their own
#     entries from 0001, sequentially, and never reuses a number.
#
# Entry fields:
#   id               AI-<github-handle>-NNNN
#   date             YYYY-MM-DD
#   tool             agent tool and version
#   model            model ID, if known
#   role             plan | build | verify | other
#   operator         human who supervised the session
#   task             one-line description
#   requirements     related requirement, invariant, or ADR IDs
#   artifacts        files created or changed
#   human_decisions  approvals, rejections, and redirections
#   verification     checks run and their results
#   evidence         transcript, plan, or pull request references
#   notes            optional

schema_version: 1

entries:
